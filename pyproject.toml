[project]
name = "feldfreund_devkit_ros"
version = "0.1.0-dev"
description = "ROS2 nodes for the Feldfreund DevKit"
authors = [{ name="Zauberzeug GmbH", email="info@zauberzeug.com" }]
readme = "README.md"
requires-python = ">=3.11, <3.14"

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
# The CI runner is a plain Python environment, not a sourced ROS workspace.
# Launch files and test doubles depend on runtime-generated ROS/UI APIs and
# are validated by the runtime/unit-test jobs instead.
exclude = '(^|/)(launch/|test_.*\.py$)'
disable_error_code = [
    "import-not-found",
    "attr-defined",
    "arg-type",
    "union-attr",
    "return-value",
    "assignment",
    "index",
    "no-redef",
    "var-annotated",
    "func-returns-value",
]

[[tool.mypy.overrides]]
module = [
    "launch.*",
    "launch_ros.*",
    "ament_index_python.*",
    "rclpy.*",
    "std_msgs.*",
    "sensor_msgs.*",
    "geometry_msgs.*",
    "nav_msgs.*",
    "gps_msgs.*",
    "rosgraph_msgs.*",
    "tf2_ros.*",
    "ublox_ubx_msgs.*",
    "lifecycle_msgs.*",
    "nav2_msgs.*",
    "std_srvs.*",
    "topological_navigation_msgs.*",
    "topological_nav_simulator.*",
    "devkit_f2c_planner.*",
    "pyquaternion",
]
ignore_missing_imports = true

[tool.pylint]
disable = [
    "C0103", # Invalid name (e.g., variable/function/class naming conventions)
    "C0111", # Missing docstring (in function/class/method)
    "C0114", # Missing module docstring
    "C0115", # Missing class docstring
    "C0116", # Missing function or method docstring
    "C0301", # Line too long (exceeds character limit)
    "R0902", # Too many public methods
    "R0903", # Too few public methods
    "R0904", # Too many public methods
    "R0911", # Too many return statements
    "R0912", # Too many branches
    "R0913", # Too many arguments
    "R0914", # Too many local variables
    "R0915", # Too many statements
    "R0917", # Too many positional arguments
    "W0511", # TODO: comments
    "W0718", # Catching too general exception
]

[tool.pylint.'TYPECHECK']
ignored-modules = [
    "rclpy",
    "std_msgs",
    "sensor_msgs",
    "geometry_msgs",
    "nav_msgs",
    "launch",
    "launch_ros",
    "ament_index_python",
    "tf2_ros",
    "gps_msgs",
    "rosgraph_msgs",
]

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py311"

[tool.ruff.lint.isort]
known-first-party = ["devkit_ui", "devkit_driver", "devkit_f2c_planner"]

[tool.ruff.lint]
select = [
    "B", "E", "F", "I", "PL", "RUF", "UP", "W",
]
fixable = ["I", "RUF022"]
ignore = [
    "RUF001", "RUF002", "RUF003", "E501", "B024",
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917",
    "PLR2004", "PLC0415",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
cache_dir = "../.pytest_cache"
testpaths = ["tests"]
