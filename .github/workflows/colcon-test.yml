name: Colcon Test

on:
  pull_request:
    branches: [caatinga-dev, robbrit/set-up-ci]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: agroecology-lab/sowbot-test

jobs:
  colcon-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read

    steps:
      - name: Log in to Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Docker image
        run: docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:jazzy

      - name: Run colcon test
        run: |
          docker run --rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:jazzy bash -c '
            source /opt/ros/jazzy/setup.bash
            source /workspace/install/setup.bash
            cd /workspace
            colcon test --packages-select devkit_driver devkit_launch devkit_ui \
              --event-handlers console_direct+ \
              --return-code-on-test-failure
          '
          docker run --rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:jazzy bash -c '
            source /opt/ros/jazzy/setup.bash
            source /workspace/install/setup.bash
            cd /workspace
            colcon test-result --verbose
          '
