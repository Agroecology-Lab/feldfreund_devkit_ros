name: Industrial CI 

on:
  push:
    branches: [ caatinga-dev ]
  pull_request:
    branches: [ caatinga-dev ]

jobs:
  industrial_ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: caatinga-dev

      - name: Run industrial_ci
        uses: ros-industrial/industrial_ci@master
        env:
          ROS_DISTRO: jazzy
          ROS_REPO: main
          # Register a local rosdep rules file for keys with no default
          # system mapping (PyPI-only deps like pyserial, nicegui).
          # rosdep itself isn't installed yet at this stage, so we just
          # write the source entry here; the later setup_rosdep step
          # runs its own rosdep update and will pick this file up,
          # resolving ament_python's stale-cache issue too.
          BEFORE_INIT: 'mkdir -p /etc/ros/rosdep/sources.list.d && echo "yaml file://${TARGET_REPO_PATH}/.github/rosdep/local.yaml" | tee /etc/ros/rosdep/sources.list.d/10-local.list'
          # Pass GCC coverage flags during CMake compilation
          CMAKE_ARGS: "-DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS='--coverage'"
          # Instruct industrial_ci to generate gcov test reports after running tests
          AFTER_RUN_TARGET_TEST: 'lcov --capture --directory . --output-file coverage.info'
          # fields2cover has no apt/pip package - the Dockerfile builds it
          # from source (cmake) and skips it in its own rosdep call too.
          # CI doesn't need to build it just to run tests.
          ROSDEP_SKIP_KEYS: 'fields2cover'
          # Noble ships PEP 668 (externally-managed Python); rosdep's pip
          # installs fail without this.
          PIP_BREAK_SYSTEM_PACKAGES: '1'
          # rosdep runs `pip3 install -U`, which fails uninstalling
          # Debian-managed deps (no RECORD file). industrial_ci doesn't
          # forward PIP_IGNORE_INSTALLED, so pass it via DOCKER_RUN_OPTS.
          DOCKER_RUN_OPTS: '-e PIP_IGNORE_INSTALLED=1'
          ADDITIONAL_DEBS: 'lcov'
          
