name: Industrial CI

on:
  push:
    branches: [ caatinga-dev ]
  pull_request:
    branches: [ caatinga-dev ]

permissions:
  contents: read

# A newer push to a pull request supersedes its running job.
# Runs on caatinga-dev itself are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  industrial_ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # No `ref:` - the default is the commit that triggered the run. Pinning
      # `ref: caatinga-dev` made pull_request runs test the base branch, not the PR.
      - uses: actions/checkout@v6

      - name: Run industrial_ci
        uses: ros-industrial/industrial_ci@master
        env:
          ROS_DISTRO: jazzy
          ROS_REPO: main
          # Register .github/rosdep/local.yaml as a rosdep source. Creating
          # /etc/ros/rosdep/sources.list.d here makes industrial_ci skip its own
          # `rosdep init`, so rosdep's default sources (base.yaml, python.yaml) are
          # never registered: every key that is not a ROS package must be defined
          # in local.yaml (PyPI-only deps like pyserial and nicegui, but also plain
          # apt ones like python3-numpy and python3-deepdiff).
          BEFORE_INIT: 'mkdir -p /etc/ros/rosdep/sources.list.d && echo "yaml file://${TARGET_REPO_PATH}/.github/rosdep/local.yaml" | tee /etc/ros/rosdep/sources.list.d/10-local.list'
          # fields2cover has no apt/pip package - the Dockerfile builds it
          # from source (cmake) and skips it in its own rosdep call too.
          # CI doesn't need to build it just to run tests.
          ROSDEP_SKIP_KEYS: 'fields2cover'
          # Noble ships PEP 668 (externally-managed Python); rosdep's pip
          # installs fail without this.
          PIP_BREAK_SYSTEM_PACKAGES: '1'
          # rosdep runs `pip3 install -U`, which fails uninstalling
          # Debian-managed deps (no RECORD file). industrial_ci doesn't
          # forward PIP_IGNORE_INSTALLED, so pass it via DOCKER_RUN_OPTS.
          DOCKER_RUN_OPTS: '-e PIP_IGNORE_INSTALLED=1'
