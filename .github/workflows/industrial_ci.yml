name: Industrial CI 

on:
  push:
    branches: [ caatinga-dev ]
  pull_request:
    branches: [ caatinga-dev ]

jobs:
  industrial_ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: caatinga-dev

      - name: Run industrial_ci
        uses: ros-industrial/industrial_ci@master
        env:
          ROS_DISTRO: jazzy
          ROS_REPO: main
          # Register a local rosdep rules file for keys with no default
          # system mapping (PyPI-only deps like pyserial, nicegui), then
          # refresh the rosdep cache so newly-added ament_python entries
          # resolve correctly for jazzy.
          BEFORE_INIT: 'mkdir -p /etc/ros/rosdep/sources.list.d && echo "yaml file://${TARGET_REPO_PATH}/.github/rosdep/local.yaml" | tee /etc/ros/rosdep/sources.list.d/10-local.list && rosdep update'
          # Pass GCC coverage flags during CMake compilation
          CMAKE_ARGS: "-DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS='--coverage'"
          # Instruct industrial_ci to generate gcov test reports after running tests
          AFTER_RUN_TARGET_TEST: 'lcov --capture --directory . --output-file coverage.info'
