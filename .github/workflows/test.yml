name: Run Tests

on: [push]

permissions:
  contents: write

jobs:
  code-checks:
    strategy:
      matrix:
        tools:
          - name: pylint
            command: >-
              pylint --disable=duplicate-code
              ./src/devkit_driver/devkit_driver
              ./src/devkit_ui/devkit_ui
              --fail-under=10.0
          - name: ruff
            command: make ruff
          - name: test
            command: make test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: install dependencies
        run: pip install -r requirements-dev.txt
      - name: auto-fix ruff errors
        if: matrix.tools.name == 'ruff'
        run: make ruff-fix
      - name: commit ruff fixes
        if: matrix.tools.name == 'ruff'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-fix ruff errors [skip ci]"
      - name: ${{ matrix.tools.name }}
        run: ${{ matrix.tools.command }}
