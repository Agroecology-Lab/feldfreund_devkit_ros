name: Run Tests

on: [push]

jobs:
  code-checks:
    strategy:
      matrix:
        tools:
          # Mypy is disabled until we figure out how to generate stubs for ROS messages, or how
          # to link together the packages.
          #- command: "make mypy"
          - command: "make pylint"
          #- command: "make ruff"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: install dependencies
        run: pip install -r requirements-dev.txt
      - name: ${{ matrix.tools.command }}
        run: ${{ matrix.tools.command }}
