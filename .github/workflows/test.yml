name: Run Tests

on: [push]

permissions:
  contents: read

jobs:
  code-checks:
    strategy:
      matrix:
        tools:
          - command: "make pylint"
          - command: "make ruff"
          - command: "make test"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: install dependencies
        run: pip install -r requirements-dev.txt
      - name: auto-fix ruff errors
        run: make ruff-fix
      - name: ${{ matrix.tools.command }}
        run: ${{ matrix.tools.command }}
