name: Run tests and upload coverage

on:
  push:
    branches: [ caatinga-dev ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Run tests and collect coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt coverage

      - name: Run tests
        run: |
          coverage run \
            --source=src/devkit_ui/devkit_ui,src/devkit_driver/devkit_driver,src/devkit_mavlink_bridge/devkit_mavlink_bridge,src/devkit_f2c_planner/devkit_f2c_planner \
            --omit='*/test_*.py' \
            -m unittest discover -s src/devkit_ui -t src/devkit_ui
          coverage xml -o coverage.xml

      - name: Upload results to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: Agroecology-Lab/feldfreund_devkit_ros
          files: coverage.xml
