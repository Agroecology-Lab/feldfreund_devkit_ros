name: Deploy Sphinx Docs to Sowbot_Data

on:
  push:
    branches: [ caatinga-dev ]

jobs:
  build-and-push-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Repository
        uses: actions/checkout@v4

      - name: Install Documentation Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz python3-pip python3-sphinx
          pip3 install --break-system-packages breathe sphinx-rtd-theme myst-parser

      - name: Generate Doxygen XML
        run: doxygen Doxyfile

      - name: Build Sphinx HTML
        run: |
          sphinx-build -b html docs docs/_build/html
          touch docs/_build/html/.nojekyll

      - name: Deploy Docs to Sowbot_Data Repo
        uses: cpina/github-action-push-to-another-repository@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.DOCS_DEPLOY_TOKEN }}
        with:
          source-directory: 'docs/_build/html'
          destination-github-username: 'Agroecology-Lab'
          destination-repository-name: 'Sowbot_Data'
          target-branch: 'main'
          target-directory: 'docs'
          user-email: 'action@github.com'
          user-name: 'GitHub Action Bot'
